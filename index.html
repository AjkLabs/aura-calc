<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Points Calculator</title>
</head>
<body>

<div class="container">
    <!-- Start Screen -->
    <div id="start-screen" class="quiz-box active">
        <h1>Aura Points Tracker</h1>
        <p class="subtitle">Calculate your exact internet aura check right now.</p>
        <button class="action-btn" onclick="startQuiz()">Check My Aura</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="quiz-box">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="question-text" id="question">Loading question...</div>
        <div class="options-list" id="options"></div>
    </div>

    <!-- Smart Link Gateway Screen -->
    <div id="gateway-screen" class="quiz-box">
        <h1>Calculation Complete</h1>
        <p class="subtitle" style="margin-bottom: 20px;">Your custom Aura Profile and global rank badge are generated.</p>
        <div style="font-size: 5rem; margin-bottom: 20px;">⚡</div>
        <button class="action-btn" onclick="triggerSmartLink()">Reveal My Aura Score</button>
    </div>

    <!-- Final Result Screen -->
    <div id="result-screen" class="quiz-box">
        <p style="text-transform: uppercase; letter-spacing: 2px; color: #a0a0c0; font-size: 0.9rem;">Your Official Scorecard</p>
        <div class="score-display" id="final-score">+0</div>
        <div class="badge" id="final-badge">Loading...</div>
        <div class="result-card">
            <p id="final-desc" style="color: #e0e0ff; line-height: 1.5; font-size: 1.1rem;"></p>
        </div>
        <p style="color: #606080; font-size: 0.85rem;">Screenshot this page to post on Snapchat / YouTube shorts!</p>
    </div>
</div>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
        background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container {
        width: 100%;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        text-align: center;
    }
    h1 {
        font-size: 2.2rem;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #ff007f, #7f00ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    p.subtitle {
        color: #a0a0c0;
        margin-bottom: 30px;
        font-size: 1rem;
    }
    .quiz-box {
        display: none;
    }
    .quiz-box.active {
        display: block;
    }
    .question-text {
        font-size: 1.3rem;
        margin-bottom: 25px;
        font-weight: 600;
        line-height: 1.4;
    }
    .option-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 16px 20px;
        margin-bottom: 12px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 1rem;
        text-align: left;
        transition: all 0.2s ease;
    }
    .option-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
    }
    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        margin-bottom: 25px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff007f, #7f00ff);
        transition: width 0.3s ease;
    }
    .action-btn {
        background: linear-gradient(45deg, #ff007f, #7f00ff);
        border: none;
        color: white;
        padding: 16px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 14px;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 10px 20px rgba(255, 0, 127, 0.3);
        transition: transform 0.2s;
    }
    .action-btn:hover {
        transform: scale(1.02);
    }
    .result-card {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        padding: 25px;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        margin-bottom: 20px;
    }
    .score-display {
        font-size: 3.5rem;
        font-weight: 800;
        color: #00ffcc;
        margin: 15px 0;
        text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }
    .badge {
        display: inline-block;
        padding: 6px 16px;
        background: rgba(0, 255, 204, 0.1);
        border: 1px solid #00ffcc;
        color: #00ffcc;
        border-radius: 20px;
        font-weight: bold;
        margin-bottom: 15px;
    }
</style>
<script>
    const smartLinkUrl = "https://asiafilm.org/4/4bc6d0cec2d16f899b2661791846fbd2";

    const questions = [
        { q: "You stumble and trip in public. What do you do?", o: [{t:"Pretend you were jogging (-50 aura)", v:-50}, {t:"Check if your favorite creator saw it (-200 aura)", v:-200}, {t:"Claim it was a specialized breakdance move (+500 aura)", v:500}, {t:"Lock eyes with a stranger, say nothing (+1000 aura)", v:1000}] },
        { q: "How fast do you reply to text messages?", o: [{t:"Instantly, phone always in hand (-150 aura)", v:-150}, {t:"Exactly 3 to 5 business days later (+400 aura)", v:400}, {t:"Leave them on read forever (+1200 aura)", v:1200}, {t:"Typing... bubble stays up for an hour (-300 aura)", v:-300}] },
        { q: "Your phone rings in a completely silent classroom. What is your ringtone?", o: [{t:"An absolute viral meme track (+600 aura)", v:600}, {t:"Standard default Apple ringtone (0 aura)", v:0}, {t:"An anime intro theme (-250 aura)", v:-250}, {t:"Fumble blindly trying to mute it (-500 aura)", v:-500}] },
        { q: "What's your go-to outfit profile?", o: [{t:"Full matching clean tracksuit (+300 aura)", v:300}, {t:"Unironically wearing shades indoors (+800 aura)", v:800}, {t:"Pyjamas because you do not care (+500 aura)", v:500}, {t:"Overly styled designer fit (-100 aura)", v:-100}] },
        { q: "You make a joke and nobody in the room laughs. Reaction?", o: [{t:"Repeat it louder thinking they missed it (-800 aura)", v:-800}, {t:"Laugh at your own joke to save it (-300 aura)", v:-300}, {t:"Say 'tough crowd' and leave the building (+400 aura)", v:400}, {t:"Stare blankly until it becomes awkward (+1500 aura)", v:1500}] },
        { q: "How do you listen to your music?", o: [{t:"Aux cord master, everyone loves your tracks (+700 aura)", v:700}, {t:"Blasting through cheap phone speakers (-600 aura)", v:-600}, {t:"Headphones max volume, ignoring the world (+200 aura)", v:200}, {t:"Humming the melody completely out of tune (-200 aura)", v:-200}] },
        { q: "You win an intense game match at the absolute last second. What do you say?", o: [{t:"'GG WP' like a humble professional (+500 aura)", v:500}, {t:"Spam chat with toxic emotes (-400 aura)", v:-400}, {t:"Immediately log off without saying a word (+1200 aura)", v:1200}, {t:"Scream into your microphone (-300 aura)", v:-300}] },
        { q: "What is your relationship with social media trends?", o: [{t:"Doing the newest dances immediately (-400 aura)", v:-400}, {t:"Viewing silently, never posting (0 aura)", v:0}, {t:"Creating the trend yourself (+2500 aura)", v:2500}, {t:"Using dead slang from 3 years ago (-200 aura)", v:-200}] },
        { q: "You lock yourself out of your house. How do you handle it?", o: [{t:"Sit on the curb and cry softly (-600 aura)", v:-600}, {t:"Climb through a window smoothly (+500 aura)", v:500}, {t:"Call your parents to rescue you (-100 aura)", v:-100}, {t:"Kick the door open (+2000 aura)", v:2000}] },
        { q: "Final check: How do you feel about your own aura level right now?", o: [{t:"It is off the charts maximum (+1000 aura)", v:1000}, {t:"Pretty average honestly (0 aura)", v:0}, {t:"I have negative aura values (-500 aura)", v:-500}, {t:"Aura is a myth, I am simply elite (+800 aura)", v:800}] }
    ];

    let currentQuestion = 0;
    let totalAura = 0;

    function startQuiz() {
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        if (currentQuestion >= questions.length) {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('gateway-screen').classList.add('active');
            return;
        }
        
        let qData = questions[currentQuestion];
        document.getElementById('question').innerText = qData.q;
        
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        qData.o.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.t;
            btn.onclick = () => selectOption(opt.v);
            optionsDiv.appendChild(btn);
        });

        let percent = ((currentQuestion) / questions.length) * 100;
        document.getElementById('progress').style.width = percent + '%';
    }

    function selectOption(value) {
        totalAura += value;
        currentQuestion++;
        showQuestion();
    }

    function triggerSmartLink() {
        window.open(smartLinkUrl, '_blank');
        document.getElementById('gateway-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        displayResults();
    }

    function displayResults() {
        let scoreTxt = totalAura >= 0 ? "+" + totalAura : totalAura;
        document.getElementById('final-score').innerText = scoreTxt + " AURA";
        
        let badge = "";
        let desc = "";
        
        if (totalAura >= 5000) {
            badge = "MYTHICAL GOD LEVEL AURA";
            desc = "Absolute legend. You walk into rooms and background music plays. Gravity bends around your sheer presence. Unstoppable energy.";
        } else if (totalAura >= 2000) {
            badge = "CERTIFIED W CHASER";
            desc = "Highly respected style and responses. You hold your own effortlessly. People look your way for validation. Elite composure.";
        } else if (totalAura >= 0) {
            badge = "STABLE VIBE VISITOR";
            desc = "Perfect balance. You don't lose points easily, but you aren't risking your sanity for extra fame. A healthy, functioning profile.";
        } else {
            badge = "CRITICAL AURA DEFICIT";
            desc = "Emergency. You are losing points at an alarming rate. It might be time to change your layout, walk backward out of rooms, and stop text bubbling.";
        }
        
        document.getElementById('final-badge').innerText = badge;
        document.getElementById('final-desc').innerText = desc;
    }
</script>
</body>
</html>
